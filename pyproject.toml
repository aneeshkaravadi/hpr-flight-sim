[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpr-flight-sim"
version = "0.1.0"
description = "6-DOF high-power rocket flight simulator: Barrowman stability, wind and weathercocking, dual-deploy recovery, Monte Carlo apogee uncertainty, and drag calibration from altimeter data."
authors = [{ name = "Aneesh Karavadi" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"  # tomllib
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
